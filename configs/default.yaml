# LSB steganalysis detector - default configuration
seed: 1337

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  features_dir: data/features
  artifacts_dir: artifacts
  manifest: data/manifest.csv

data:
  # Expected manual-download layout under paths.raw_dir:
  #   train/{clean,stego}  val/{clean,stego}  test/{clean,stego}
  splits: [train, val, test]
  classes: [clean, stego]
  grayscale: true
  # CNN/cached image edge length (raw images are 512x512 in Stego-Images-Dataset)
  image_size: 256
  # Cap number of images per (split, class) for quick experiments. null = all.
  limit_per_class: null

features:
  # Analyse original RGB channels. LSB payload in colour images is spread over
  # R/G/B; converting to grayscale mixes the bit-planes and hides the signal.
  color: true
  spam:
    threshold: 3          # T -> states = 2T+1
  srm:
    threshold: 2          # quantization T for residuals
    # subset of high-pass filters is defined in src/features/srm.py
  lsb:
    include_autocorr: true

classical:
  model: xgboost          # xgboost | svm
  n_folds: 5
  n_jobs: -1
  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.9
    colsample_bytree: 0.8
    tree_method: hist
    eval_metric: auc
  svm:
    C: 5.0
    gamma: scale

cnn:
  arch: srnet_lite        # srnet_lite | efficientnet_v2_s | resnet18
  epochs: 40
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 4
  amp: true
  patience: 8
  image_size: 256
  in_channels: 3           # 3 = RGB (correct for colour LSB), 1 = grayscale
  # Only random crop + horizontal flip: anything lossy destroys the LSB signal.
  augment: true

eval:
  threshold: 0.5
  target_tpr: 0.95        # report FPR at this TPR
